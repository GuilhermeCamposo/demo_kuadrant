kind: ConfigMap
apiVersion: v1
metadata:
  name: dynamic-plugins-rhdh
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      - package: ./dynamic-plugins/dist/backstage-plugin-notifications
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-notifications-backend-dynamic
        disabled: false            
      - package: ./dynamic-plugins/dist/backstage-community-plugin-rbac
        disabled: false    
      - disabled: false
        package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic   
      - disabled: false
        package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
      - disabled: false
        package: ./dynamic-plugins/dist/backstage-plugin-kubernetes     
      - disabled: false
        package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic
      - disabled: false
        package: ./dynamic-plugins/dist/backstage-community-plugin-topology
      - disabled: false
        package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.45.3__2.4.3                       
      - disabled: false
        package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-redhat-argocd-backend:bs_1.42.5__0.10.0
      - disabled: false
        package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:bs_1.45.3__1.8.1                
      - disabled: false
        package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.45.3__3.33.3
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-tekton:
                mountPoints:
                - config:
                    if:
                      allOf:
                      - isTektonCIAvailable
                    layout:
                      gridColumn: 1 / -1
                      gridRowStart: 1
                  importName: TektonCI
                  mountPoint: entity.page.ci/cards
      - package: oci://quay.io/gcamposo/backstage-community-plugin-entity-feedback:0.12.0!backstage-community-plugin-entity-feedback
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-entity-feedback:
                entityTabs:
                  - mountPoint: entity.page.feedback
                    path: /feedback
                    title: Feedback
                mountPoints:
                  - config:
                      layout:
                        gridColumn: 1 / -1
                    importName: StarredRatingButtons
                    mountPoint: entity.page.feedback/cards
                  - config:
                      layout:
                        gridColumn: 1 / -1
                    importName: StarredRatingsTable
                    mountPoint: entity.page.feedback/cards
                  - config:
                      layout:
                        gridColumn: 1 / -1
                    importName: EntityFeedbackResponseContent
                    mountPoint: entity.page.feedback/cards
      - package: oci://quay.io/gcamposo/backstage-community-plugin-entity-feedback-backend:0.14.0!backstage-community-plugin-entity-feedback-backend
        disabled: false

      - package: "@kuadrant/kuadrant-backstage-plugin-backend-dynamic@v0.2.1"
        integrity: sha512-pttQ6Lp7wD6EqDXAC3AIm4FWuQYO0i1KwoR0k6opTTyRZOGaNyO3YmPQdF403n+WjfTZRE+dfccD/9R4/SO5iA==
        disabled: false

      - package: "@kuadrant/kuadrant-backstage-plugin-frontend@v0.2.1"
        integrity: sha512-E4zgwY3QQmA2mn0CwO2Zwc0k9/oCtHcsVHRcrKal2PfnXv6chKb9fCKi5SznH9FbNtx8fHVYnac9SQjFh5XGCA==
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              internal.plugin-kuadrant:
                apiFactories:
                  - importName: kuadrantApiFactory
                appIcons:
                  - name: kuadrantIcon
                    importName: KuadrantIcon
                  - name: apiIcon
                    importName: ApiIcon
                  - name: keyIcon
                    importName: KeyIcon
                  - name: approvalIcon
                    importName: ApprovalIcon
                menuItems:
                  kuadrant.api-products:
                    parent: kuadrant
                  kuadrant.my-api-keys:
                    parent: kuadrant
                  kuadrant.api-key-approval:
                    parent: kuadrant
                dynamicRoutes:
                  - path: /kuadrant
                    importName: KuadrantPage
                    menuItem:
                      icon: kuadrantIcon
                      text: Kuadrant
                  - path: /kuadrant/api-products
                    importName: ApiProductsPage
                    menuItem:
                      icon: apiIcon
                      text: API Products
                  - path: /kuadrant/my-api-keys
                    importName: MyApiKeysPage
                    menuItem:
                      icon: keyIcon
                      text: My API Keys
                  - path: /kuadrant/api-key-approval
                    importName: ApiKeyApprovalPage
                    menuItem:
                      icon: approvalIcon
                      text: API Key Approval
                  - path: /kuadrant/api-products/:namespace/:name
                    importName: ApiProductDetailPage
                  - path: /kuadrant/api-keys/:namespace/:name
                    importName: ApiKeyDetailPage
                mountPoints:
                  - mountPoint: entity.page.api/cards
                    importName: EntityKuadrantApiKeyManagementTab
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        allOf:
                          - isKind: api
                  - mountPoint: entity.page.api/cards
                    importName: EntityKuadrantApiProductInfoContent
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        allOf:
                          - isKind: api    