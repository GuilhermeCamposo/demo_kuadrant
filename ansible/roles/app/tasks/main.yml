- name: Check NS {{ app_ns }}
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    api_version: v1
    kind: Namespace
    name: '{{ app_ns }}'
    state: present

- name: Check Hello App
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    state: present
    namespace: '{{ app_ns }}'
    resource_definition: "{{ lookup('template', 'hello-app.yml.j2') }}"

- name: Check HttpRoute {{ app_ns }}
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    state: present
    namespace: '{{ app_ns }}'
    resource_definition: "{{ lookup('template', 'hello-app-httproute.yml.j2') }}"

- name: Check Policies
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    state: present
    namespace: '{{ app_ns }}'
    resource_definition: "{{ lookup('template', item) }}"
  loop:
    - auth-policy.yml.j2
    - plan-policy.yml.j2
